---
- name: Configure kernel hardening
  ansible.builtin.copy:
    content: |
      # Homelab kernel hardening
      net.ipv4.tcp_syncookies = 1
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.conf.all.log_martians = 1
      kernel.dmesg_restrict = 1
    dest: /etc/sysctl.d/99-hardening.conf
    mode: '0644'
  notify: Apply sysctl

# Ubuntu 26.04 sets this to 1, which stacks container AppArmor profiles on host profiles matched by path
- name: Let container runtimes replace the unconfined AppArmor profile
  ansible.builtin.copy:
    content: |
      kernel.apparmor_restrict_unprivileged_unconfined = 0
    dest: /etc/sysctl.d/20-apparmor.conf
    mode: '0644'
  notify: Apply sysctl
